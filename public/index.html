<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Угадай кто?</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:light;--bg:#f5f5f2;--paper:#fff;--ink:#20211f;--muted:#81837d;--line:#e8e9e4;--accent:#c9f36a;--accent2:#e9f8cf;--red:#f6d5d0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}button,input{font:inherit}button{cursor:pointer;border:0;transition:transform .16s,background .16s,opacity .16s}button:active{transform:scale(.97)}.app{max-width:1050px;margin:auto;padding:22px 20px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:36px}.brand{font-size:15px;font-weight:850;letter-spacing:-.5px;display:flex;align-items:center;gap:9px}.mark{width:25px;height:25px;background:var(--accent);border-radius:8px;display:grid;place-items:center;font-size:14px}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 11px}.screen{display:none;animation:appear .24s ease}.screen.active{display:block}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.hero{max-width:620px;margin:10vh auto 0;text-align:center}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:10px;color:var(--muted);font-weight:750}.hero h1{font-size:clamp(44px,8vw,76px);letter-spacing:-5px;line-height:.98;margin:18px 0}.hero p{color:var(--muted);font-size:15px;line-height:1.6;max-width:380px;margin:20px auto 30px}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.btn{background:var(--ink);color:white;border-radius:13px;padding:14px 19px;font-size:13px;font-weight:700}.btn.primary{background:var(--accent);color:var(--ink)}.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.btn.small{padding:10px 13px;border-radius:10px}.btn:disabled{opacity:.4;cursor:not-allowed}.menu-note{font-size:11px;color:var(--muted);margin-top:24px}.gamehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:22px}.gamehead h2{margin:7px 0 0;font-size:clamp(24px,4vw,36px);letter-spacing:-1.5px}.turnbox{background:var(--paper);border:1px solid var(--line);padding:10px 13px;border-radius:13px;min-width:145px}.turnbox small{display:block;color:var(--muted);font-size:10px;margin-bottom:5px}.turnbox strong{font-size:13px}.statusline{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-bottom:16px}.dot{width:7px;height:7px;border-radius:50%;background:#89c93f}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}.person{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;padding:0;text-align:left;min-width:0;color:var(--ink)}.portrait{aspect-ratio:4/4.2;background:#e8e9e3;position:relative;overflow:hidden;display:grid;place-items:center}.portrait img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.portrait .initial{font-size:40px;line-height:1}.person .info{padding:9px 9px 10px}.person .name{font-size:12px;font-weight:750;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person .from{font-size:10px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.person.out{opacity:.27;filter:grayscale(1)}.person.out:after{content:'×';position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:300;color:var(--ink);background:#f4f4f0a8}.person.selected{outline:3px solid var(--accent);outline-offset:-3px}.person.secret .portrait:after{content:'?';position:absolute;inset:0;display:grid;place-items:center;background:var(--accent);font-size:40px;font-weight:850}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:20px 0}.controls .spacer{flex:1}.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}.panel h3{margin:0 0 8px;font-size:14px}.panel p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}.hidden{display:none!important}.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:20px}.choice{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;text-align:left}.choice strong{display:block;font-size:14px}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:6px}.secretcard{max-width:360px;margin:22px auto;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:20px;text-align:center}.secretcard .person{width:180px;display:block;margin:15px auto}.secretcard .person .portrait{aspect-ratio:4/4.2}.secretcard h2{font-size:25px;letter-spacing:-1px;margin:10px}.secretcard p{font-size:12px;color:var(--muted);line-height:1.5}.inputrow{display:flex;gap:8px;margin-top:14px}.inputrow input{min-width:0;flex:1;border:1px solid var(--line);background:var(--bg);padding:12px;border-radius:11px;outline:none}.rules{max-width:620px;margin:0 auto}.rules h2{font-size:38px;letter-spacing:-2px}.rule{display:flex;gap:13px;padding:15px 0;border-bottom:1px solid var(--line)}.num{width:27px;height:27px;border-radius:9px;background:var(--accent2);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}.rule strong{font-size:13px}.rule p{font-size:12px;color:var(--muted);line-height:1.55;margin:5px 0 0}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 16px;border-radius:12px;font-size:12px;z-index:9;box-shadow:0 8px 30px #0002;max-width:90vw;text-align:center}.modalbg{position:fixed;inset:0;background:#17181475;display:grid;place-items:center;padding:20px;z-index:10}.modal{background:var(--paper);border-radius:20px;padding:22px;max-width:390px;width:100%;text-align:center}.modal h2{font-size:25px;letter-spacing:-1px;margin:6px 0 10px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}.modal .actions{margin-top:18px}.winner{font-size:52px;margin:6px}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:24px;color:var(--muted);font-size:10px}
@media(max-width:700px){.app{padding:16px 12px 30px}.top{margin-bottom:24px}.board{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.person{border-radius:11px}.person .info{padding:7px}.person .name{font-size:11px}.person .from{font-size:9px}.portrait .initial{font-size:32px}.gamehead{margin-bottom:18px}.turnbox{min-width:120px;padding:9px}.hero{margin-top:8vh}.hero h1{letter-spacing:-3px}.controls .spacer{display:none}.controls{gap:7px}.controls .btn{flex:1}.choicegrid{grid-template-columns:1fr}.footer{margin-top:20px}}
@media(max-width:360px){.board{grid-template-columns:repeat(3,minmax(0,1fr))}.gamehead{display:block}.turnbox{margin-top:12px;display:inline-block}}
.vs{display:flex;gap:10px;margin-bottom:14px}.pl{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:9px}.pl.turn{outline:2px solid var(--accent)}.av{width:38px;height:38px;border-radius:50%;background:var(--accent2);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.av img{width:100%;height:100%;object-fit:cover}.pl b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pl small{font-size:10px;color:var(--muted)}</style></head><body><main class="app"><header class="top"><div class="brand"><span class="mark">?</span> УГАДАЙ КТО</div><div class="pill" id="topPill">онлайн</div></header>
<section class="screen active" id="home"><div class="hero"><div class="eyebrow">онлайн для двоих</div><h1>Угадай<br>кто?</h1><p>Создай комнату и отправь ссылку другу — играйте с разных устройств.</p><div class="inputrow" style="max-width:300px;margin:0 auto 14px"><select id="catSel" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);padding:12px;border-radius:11px;font:inherit"></select></div><div class="inputrow" style="max-width:300px;margin:0 auto 14px"><select id="modeSel" style="flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);padding:12px;border-radius:11px;font:inherit"><option value="0">💬 Вопросы текстом</option><option value="1">🗣 Играем вживую (голосом)</option></select></div><div class="actions"><button class="btn primary" onclick="createRoom()">Создать комнату</button></div><div class="inputrow" style="max-width:300px;margin:16px auto 0"><input id="codeIn" placeholder="Код комнаты" maxlength="5"><button class="btn" onclick="joinRoom(document.getElementById('codeIn').value)">Войти</button></div></div></section>
<section class="screen" id="wait"><div class="hero"><div class="eyebrow" id="waitCode"></div><h1 style="font-size:clamp(34px,8vw,56px);letter-spacing:-3px" id="waitTitle"></h1><p id="waitText"></p><div class="actions"><button class="btn primary" id="shareBtn" onclick="share()">Пригласить друга</button></div><div class="vs" id="vs2" style="margin-top:22px"></div></div></section>
<section class="screen" id="pick"><div class="eyebrow">шаг 1</div><h2 style="font-size:clamp(28px,6vw,42px);letter-spacing:-2px;margin:9px 0">Загадай персонажа</h2><p style="color:var(--muted);font-size:13px">Выбери карточку. Соперник её не увидит.</p><div class="board" id="secretBoard"></div><div class="controls"><span class="spacer"></span><button class="btn primary" id="pickBtn" disabled onclick="send({t:'pick',id:sel})">Это мой персонаж</button></div></section>
<section class="screen" id="game"><div class="gamehead"><div><div class="eyebrow" id="turnLabel"></div><h2 id="gameTitle"></h2></div><div class="turnbox"><small>Твой персонаж</small><strong id="mineName"></strong></div></div><div class="vs" id="vs"></div><div class="panel" id="panel"></div><div class="board" id="gameBoard"></div><div class="controls"><button class="btn light" onclick="marks.clear();drawGame()">Сбросить отметки</button><span class="spacer"></span><button class="btn primary" id="guessBtn" onclick="guessMode()">Назвать персонажа</button></div></section>
<section class="screen" id="guess"><div class="eyebrow">финальная догадка</div><h2 style="font-size:34px;letter-spacing:-2px;margin:8px 0">Кого загадал соперник?</h2><div class="board" id="guessBoard" style="margin-top:20px"></div><div class="controls"><button class="btn light" onclick="render()">Отмена</button><span class="spacer"></span><button class="btn primary" id="guessOk" disabled onclick="send({t:'guess',id:sel})">Подтвердить</button></div></section>
<section class="screen" id="end"><div class="hero"><div class="winner">✦</div><div class="eyebrow">партия завершена</div><h1 style="font-size:clamp(42px,8vw,70px);letter-spacing:-4px" id="endTitle"></h1><p id="endText"></p><div class="actions"><button class="btn primary" onclick="send({t:'again'})">Реванш</button></div></div></section></main><div id="toast" class="toast hidden"></div>
<script>const CFG=__CFG__;
let people=[],photos={};const EMO={'Музыка':'🎤','Кино':'🎬','Спорт':'⚽','Мультфильмы':'🧸','Аниме':'🌸','Игры':'🎮','Супергерои':'🦸','Блогеры':'📱','История':'🏛️','Наука':'🔬','Русская музыка':'🎙️'};const palettes=['#dfe9db','#f3dfd8','#dce6f4','#f0e6c9','#e7def2','#d8ece9','#f2dfe8','#e8e7df'];const tg=window.Telegram&&Telegram.WebApp;if(tg){tg.ready();tg.expand()}
const u=tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user,ME={name:u?((u.first_name||'')+(u.last_name?' '+u.last_name:'')).trim()||u.username||'Игрок':'Игрок',photo:(u&&u.photo_url)||''};
if(!u){try{ME.name=localStorage.gwn||(localStorage.gwn=(prompt('Как тебя зовут?')||'Игрок').trim().slice(0,30)||'Игрок')}catch(e){}}
const token=localStorage.gwt||(localStorage.gwt=Math.random().toString(36).slice(2)+Date.now().toString(36));
let S=null,ws,room=null,marks=new Set(),sel=null,cur='home';
const $=id=>document.getElementById(id),esc=t=>String(t).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
function show(id){cur=id;document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active',s.id===id))}
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>t.classList.add('hidden'),2500)}
function send(o){ws&&ws.readyState===1&&ws.send(JSON.stringify(o))}
function connect(init){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);ws.onopen=init;
  ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.t==='err'){toast(m.m);if(!S){room=null;sessionStorage.removeItem('room')}}else{S=m;room=m.code;sessionStorage.room=room;render()}};
  ws.onclose=()=>{if(room)setTimeout(()=>connect(()=>send({t:'join',name:ME.name,photo:ME.photo,room,token})),1500)}}
function createRoom(){connect(()=>send({t:'join',name:ME.name,photo:ME.photo,create:1,token,cat:$('catSel').value,live:$('modeSel').value==='1'}))}
function joinRoom(c){c=(c||'').trim().toUpperCase();if(c)connect(()=>send({t:'join',name:ME.name,photo:ME.photo,room:c,token}))}
function link(){const c=S.code;return CFG.bot?`https://t.me/${CFG.bot}${CFG.app?'/'+CFG.app:''}?startapp=${c}`:location.origin+'/?room='+c}
function share(){const u='https://t.me/share/url?url='+encodeURIComponent(link())+'&text='+encodeURIComponent('Сыграем в «Угадай кто?» Код комнаты: '+S.code);tg?tg.openTelegramLink(u):window.open(u,'_blank')}
function makeCard(i,fn,cls){const p=people[i],el=document.createElement('button');el.className='person'+(cls?' '+cls:'');el.dataset.id=i;const pt=document.createElement('div');pt.className='portrait';pt.style.background=palettes[i%palettes.length];
  const em=document.createElement('span');em.className='initial';em.textContent=p[2];pt.appendChild(em);
  if(photos[i]){const im=document.createElement('img');im.src=photos[i];im.alt=p[0];im.onerror=()=>im.remove();pt.appendChild(im)}
  const inf=document.createElement('div');inf.className='info';inf.innerHTML='<div class="name"></div><div class="from"></div>';inf.firstChild.textContent=p[0];inf.lastChild.textContent=p[1];el.append(pt,inf);el.onclick=fn;return el}
function board(id,fn,cls){const b=$(id);b.innerHTML='';people.forEach((_,i)=>b.appendChild(makeCard(i,()=>fn(i),cls&&cls(i))))}
function choose(id,btn){return i=>{sel=i;document.querySelectorAll('#'+id+' .person').forEach(c=>c.classList.toggle('selected',+c.dataset.id===i));$(btn).disabled=false}}
function drawGame(){board('gameBoard',i=>{marks.has(i)?marks.delete(i):marks.add(i);drawGame()},i=>marks.has(i)?'out':'')}
function guessMode(){sel=null;$('guessOk').disabled=true;board('guessBoard',choose('guessBoard','guessOk'));show('guess')}
function ask(){const v=$('qIn').value.trim();if(v)send({t:'ask',text:v})}
function panel(s,me){let h='';
  if(s.last)h+='<p style="margin-bottom:8px">'+(s.last.seat===s.seat?'Ты ошибся':'Соперник ошибся')+': это не '+esc(people[s.last.id][0])+'.</p>';
  if(s.live&&s.stage==='ask')h+=me?`<h3>Твой ход</h3><p>Задай вопрос вслух, выслушай ответ и убери карточки, которые не подходят.</p><div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary small" onclick="send({t:'end'})">Закончить ход →</button></div>`:'<h3>Ход соперника</h3><p>Отвечай на его вопрос вслух: «Да» или «Нет».</p>';else if(s.stage==='ask')h+=me?'<h3>Твой ход</h3><p>Задай вопрос, на который можно ответить «Да» или «Нет».</p><div class="inputrow"><input id="qIn" placeholder="У него есть усы?" maxlength="120"><button class="btn primary small" onclick="ask()">Спросить</button></div>':'<h3>Ход соперника</h3><p>Ждём его вопрос…</p>';
  else if(s.stage==='answer')h+='<h3>Вопрос: «'+esc(s.q)+'»</h3>'+(me?'<p>Ждём ответ соперника…</p>':'<div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary small" onclick="send({t:\'reply\',a:\'Да\'})">Да</button><button class="btn light small" onclick="send({t:\'reply\',a:\'Нет\'})">Нет</button></div>');
  else if(s.stage==='mark')h+='<h3>«'+esc(s.q)+'» — '+s.a+'</h3>'+(me?'<p>Убери карточки, которые не подходят, затем заверши ход.</p><div class="actions" style="justify-content:flex-start;margin-top:12px"><button class="btn primary small" onclick="send({t:\'end\'})">Закончить ход →</button></div>':'<p>Соперник убирает карточки…</p>');
  return h}
function render(){const s=S;if(!s)return;if(s.deck)setDeck(s.deck);{const V=vs(s);$('vs').innerHTML=V;$('vs2').innerHTML=V}$('topPill').textContent='комната '+s.code;
  if(s.stage==='lobby'){$('waitCode').textContent='код '+s.code;$('waitTitle').textContent='Ждём друга';$('waitText').textContent='Отправь приглашение — как только он зайдёт, игра начнётся.';$('shareBtn').classList.remove('hidden');return show('wait')}
  if(s.stage==='pick'){if(s.mine!==null){$('waitCode').textContent='код '+s.code;$('waitTitle').textContent='Ждём соперника';$('waitText').textContent='Ты выбрал персонажа. Соперник ещё выбирает.';$('shareBtn').classList.add('hidden');return show('wait')}
    if(cur!=='pick'){sel=null;marks.clear();$('pickBtn').disabled=true;board('secretBoard',choose('secretBoard','pickBtn'));show('pick')}return}
  if(s.stage==='over'){const w=s.over.winner===s.seat;$('endTitle').textContent=w?'Победа!':'Поражение';$('endText').textContent=(w?'Ты угадал: ':'Соперник угадал твоего персонажа. Он загадал: ')+people[s.over.secrets[w?1-s.seat:1-s.seat]][0]+'.';return show('end')}
  const me=s.turn===s.seat;$('turnLabel').textContent=me?'твой ход':'ход соперника'+(s.oppOnline?'':' · не в сети');$('gameTitle').textContent=me?'Твоя очередь':'Соперник думает';$('mineName').textContent=people[s.mine][0];
  $('panel').innerHTML=panel(s,me);$('guessBtn').disabled=!me;drawGame();show('game')}
const r0=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||new URLSearchParams(location.search).get('room')||sessionStorage.room;if(r0)joinRoom(r0);


function av(p){return '<span class="av">'+(p&&p.p?'<img src="'+esc(p.p)+'" referrerpolicy="no-referrer" onerror="this.remove()">':'')+esc(((p&&p.n)||'?').trim()[0]||'?')+'</span>'}
function vs(s){const pl=(p,who,t)=>'<div class="pl'+(t?' turn':'')+'">'+av(p)+'<div style="min-width:0"><b>'+esc(p?p.n:'Ждём соперника…')+'</b><small>'+who+'</small></div></div>';
  const on=['ask','answer','mark'].includes(s.stage);return pl(s.names[s.seat],'Ты',on&&s.turn===s.seat)+pl(s.names[1-s.seat],'Соперник',on&&s.turn!==s.seat)}
let deckKey='';
function setDeck(d){const k=JSON.stringify(d);if(k===deckKey)return;deckKey=k;people=d.map(([n,c,r])=>[r||n,c,EMO[c]||'❓',n]);photos={};
  people.forEach((p,i)=>{fetch('https://'+(p[1]==='Русская музыка'?'ru':'en')+'.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent((p[1]==='Русская музыка'?p[0]:p[3]).replace(/ /g,'_'))).then(r=>r.ok?r.json():null).then(x=>{if(k!==deckKey||!x||!x.thumbnail)return;photos[i]=x.thumbnail.source;
    document.querySelectorAll('.person[data-id="'+i+'"] .portrait').forEach(pt=>{if(!pt.querySelector('img')){const im=document.createElement('img');im.src=x.thumbnail.source;im.alt=p[0];im.onerror=()=>im.remove();pt.appendChild(im)}})}).catch(()=>{})})}
$('catSel').innerHTML='<option value="all">🎲 Все категории (случайно)</option>'+CFG.cats.map(c=>'<option value="'+c+'">'+(EMO[c]||'')+' '+c+'</option>').join('');
</script></body></html>
